name: Code Linter

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/code_linter.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/code_linter.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # Без ref: ${{ github.ref_name }} — на pull_request это "<номер>/merge",
      # checkout и так берёт нужный ref, а явное указание только мешало.
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir uv
          uv pip install --no-cache-dir torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu -q --system
          uv pip install --no-cache-dir flake8 pylint vulture ruff -r requirements.txt -q --system

      # Все проверки ниже — continue-on-error: в кодовой базе тысячи накопленных
      # замечаний, блокирующим такой lint сделать нельзя. Но раньше их вывод просто
      # терялся в логах, поэтому теперь каждый пишет файл, а сводка уезжает в job summary.
      - name: Run flake8
        id: flake8
        continue-on-error: true
        run: |
          flake8 $(git ls-files '*.py') --max-line-length 140 --max-doc-length 140 --doctests --statistics 2>&1 | tee flake8.log

      - name: Run PyLint
        id: pylint
        continue-on-error: true
        run: |
          pylint $(git ls-files '*.py') --max-line-length 140 --disable=R0801 2>&1 | tee pylint.log

      - name: Run Vulture
        id: vulture
        continue-on-error: true
        run: |
          vulture $(git ls-files '*.py') 2>&1 | tee vulture.log

      - name: Run Ruff (правила из ruff.toml)
        id: ruff
        continue-on-error: true
        run: |
          ruff check . --statistics 2>&1 | tee ruff.log

      - name: Критичные ошибки Ruff (pyflakes/синтаксис)
        run: |
          ruff check --select F,E9 .

      - name: Сводка линтеров
        if: ${{ always() }}
        env:
          RES_FLAKE8: ${{ steps.flake8.outcome }}
          RES_PYLINT: ${{ steps.pylint.outcome }}
          RES_VULTURE: ${{ steps.vulture.outcome }}
          RES_RUFF: ${{ steps.ruff.outcome }}
        run: |
          # grep -c печатает 0 и выходит с кодом 1, если совпадений нет, —
          # поэтому `|| true`, а не `|| echo 0` (иначе в таблицу попало бы два нуля)
          count_lines() { if [ -f "$1" ]; then grep -cve '^[[:space:]]*$' "$1" || true; else echo 0; fi; }

          {
            echo "## Результат линтеров"
            echo
            echo "| Инструмент | Исход | Строк вывода |"
            echo "|---|---|---|"
            echo "| flake8 | $RES_FLAKE8 | $(count_lines flake8.log) |"
            echo "| pylint | $RES_PYLINT | $(count_lines pylint.log) |"
            echo "| vulture | $RES_VULTURE | $(count_lines vulture.log) |"
            echo "| ruff (select = ALL) | $RES_RUFF | $(count_lines ruff.log) |"
            echo
            echo "Блокирующим является только шаг «Критичные ошибки Ruff» (F, E9) —"
            echo "неиспользуемые импорты, неопределённые имена и синтаксис."
            echo
            echo "<details><summary>Ruff: статистика по правилам</summary>"
            echo
            echo '```'
            [ -f ruff.log ] && head -40 ruff.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>Vulture: мёртвый код</summary>"
            echo
            echo '```'
            [ -f vulture.log ] && head -40 vulture.log
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
