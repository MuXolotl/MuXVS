name: Link Test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test_links.yml'
      - 'rvc/inference/modules/download_source.py'
      - 'rvc/inference/modules/model_manager.py'
  pull_request:
    paths:
      - '.github/workflows/test_links.yml'
      - 'rvc/inference/modules/download_source.py'
      - 'rvc/inference/modules/model_manager.py'

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        pip install --no-cache-dir uv
        uv pip install --no-cache-dir -U requests gdown mega-x gradio -q --system

    # continue-on-error, чтобы один мёртвый источник не обрывал проверку остальных
    - name: Google Drive
      id: gdrive
      continue-on-error: true
      run: |
        python3 -m rvc.inference.modules.model_manager "https://drive.google.com/file/d/1LT68BM6AoR1GLZV-mMWAUV1plGCORcqn/view?usp=sharing" "test1"

    - name: HuggingFace
      id: huggingface
      continue-on-error: true
      run: |
        python3 -m rvc.inference.modules.model_manager "https://huggingface.co/Politrees/Victor_Tsoi/resolve/main/Victor_Tsoi.zip?download=true" "test2"

    - name: Pixeldrain
      id: pixeldrain
      continue-on-error: true
      run: |
        python3 -m rvc.inference.modules.model_manager "https://pixeldrain.com/u/mN7BsdZb" "test3"

    - name: Mega
      id: mega
      continue-on-error: true
      run: |
        python3 -m rvc.inference.modules.model_manager "https://mega.nz/file/vgMBFB5I#-ZUtYEvV-OImhRjs9b1UpFyE2lm-BuEbODD3N9b3sg4" "test4"

    - name: Yandex Disk
      id: yandex
      continue-on-error: true
      run: |
        python3 -m rvc.inference.modules.model_manager "https://disk.yandex.ru/d/njvq8NEQgS2OhQ" "test5"

    - name: Dropbox
      id: dropbox
      continue-on-error: true
      run: |
        python3 -m rvc.inference.modules.model_manager "https://www.dropbox.com/scl/fi/83w0xvvdkmokpzx7aoqh8/Victor_Tsoi.zip?rlkey=i6xmw8655ab49x0ix5vj16mox&st=c60rv2c5&dl=0" "test6"

    - name: Отчёт по источникам
      if: ${{ always() }}
      env:
        RES_GDRIVE: ${{ steps.gdrive.outcome }}
        RES_HUGGINGFACE: ${{ steps.huggingface.outcome }}
        RES_PIXELDRAIN: ${{ steps.pixeldrain.outcome }}
        RES_MEGA: ${{ steps.mega.outcome }}
        RES_YANDEX: ${{ steps.yandex.outcome }}
        RES_DROPBOX: ${{ steps.dropbox.outcome }}
      run: |
        {
          echo "## Проверка источников загрузки"
          echo
          echo "| Источник | Исход |"
          echo "|---|---|"
        } >> "$GITHUB_STEP_SUMMARY"

        total=0; failed=0
        for entry in "Google Drive|$RES_GDRIVE" "HuggingFace|$RES_HUGGINGFACE" "Pixeldrain|$RES_PIXELDRAIN" \
                     "Mega|$RES_MEGA" "Yandex Disk|$RES_YANDEX" "Dropbox|$RES_DROPBOX"; do
          name="${entry%%|*}"; outcome="${entry##*|}"
          total=$((total + 1))
          if [ "$outcome" = "success" ]; then
            echo "| $name | ✅ success |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| $name | ❌ $outcome |" >> "$GITHUB_STEP_SUMMARY"
            failed=$((failed + 1))
          fi
        done

        echo
        echo "Всего источников: $total, не отработало: $failed"

        # job падает, только если не отработало всё — значит сломан model_manager, а не ссылки
        if [ "$failed" -eq "$total" ]; then
          echo "::error::Ни один источник не отработал."
          exit 1
        fi
        if [ "$failed" -gt 0 ]; then
          echo "::warning::Не отработало источников: $failed из $total."
        fi
