name: Code Formatter

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '.github/workflows/code_formatter.yml'
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/code_formatter.yml'

jobs:
  # ─────────────────────────────────────────────────────────────
  # PR: только проверяем форматирование, ничего не коммитим.
  # Раньше форматирование вообще не проверялось до мержа в main,
  # а авто-PR от форматтера приходил уже постфактум.
  # ─────────────────────────────────────────────────────────────
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -U ruff

      - name: Run Ruff Formatter (check)
        run: ruff format --check .

      # Блокируем только критичное: неиспользуемые импорты, неопределённые имена, синтаксис.
      # Полный набор из ruff.toml (select = ALL) даёт тысячи накопленных замечаний
      # и блокирующим быть не может — он уходит в сводку ниже.
      - name: Run Ruff Linter (критичные правила)
        run: ruff check --select F,E9 .

      - name: Сводка по полному набору правил
        if: ${{ always() }}
        run: |
          ruff check . --statistics > ruff_full.log 2>&1 || true
          {
            echo "## Ruff: статистика по правилам из \`ruff.toml\` (\`select = ALL\`)"
            echo
            echo "Эти замечания не блокируют мерж — справочно."
            echo
            echo '```'
            head -40 ruff_full.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # push в main: как и раньше — автофикс и PR с косметикой
  # ─────────────────────────────────────────────────────────────
  format_code:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -U ruff

      - name: Run Ruff Linter (with auto-fix)
        run: ruff check . --fix || true

      - name: Run Ruff Formatter
        run: ruff format . || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          git diff --stat >> "$GITHUB_STEP_SUMMARY" || true

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "style(ruff): автоматическое форматирование кода"
          title: "🎨 Автоматическое форматирование кода"
          body: |
            Этот Pull Request был создан автоматически GitHub Actions для применения единых стилей оформления кода.

            🔧 Форматирование выполнено с помощью [`Ruff`](https://github.com/astral-sh/ruff):
            > - Автоматическое исправление стиля и линтинга (`ruff check --fix`)
            > - Применение форматтера (`ruff format`)

            ✨ Изменения затрагивают только стиль кода, логика работы не изменена.
            > Целевая версия Python: **3.13**
          base: main
          branch: "formatter/${{ github.ref_name }}"
          delete-branch: true
