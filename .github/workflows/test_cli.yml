name: CLI Scripts Test

on:
  push:
    branches:
      - main
    paths:
      - 'requirements.txt'
      - 'assets/**'
      - 'rvc/_library/**'
      - 'rvc/inference/**'
      - '.github/workflows/test_cli.yml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'assets/**'
      - 'rvc/_library/**'
      - 'rvc/inference/**'
      - '.github/workflows/test_cli.yml'

# Матрица тяжёлая (8 job'ов, каждый тянет веса моделей), поэтому устаревшие
# прогоны одного и того же ref гасим. Для push в ветку не отменяем — только для PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rvc_cli:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      # Одна упавшая версия Python не должна гасить остальные — смысл матрицы в сравнении
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip for Python <3.11
      if: ${{ matrix.python-version == '3.10' }}
      run: |
        python -m pip install --upgrade "pip<=24.0"

    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        pip install --no-cache-dir uv
        uv pip install --no-cache-dir torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu -q --system
        uv pip install --no-cache-dir -r requirements.txt -q --system

    - name: Install RVC models
      run: |
        python3 -m rvc.inference.modules.model_manager "https://huggingface.co/Politrees/Victor_Tsoi/resolve/main/Victor_Tsoi.zip?download=true" "Tsoi"

    - name: Set up test audio
      run: |
        mkdir -p audio
        wget https://huggingface.co/Politrees/audio_for_test/resolve/main/BritishEnglishUKTest5.mp3 -O audio/test.mp3

    - name: Run rvc script
      run: |
        python3 -m rvc.inference.infer_cli rvc --input_path "audio/test.mp3" --rvc_model "Tsoi" --f0_method "rmvpe+" --f0_min 1 --f0_max 1100 --rvc_pitch -6 --protect 0.5 --index_rate 0 --volume_envelope 1 --autopitch True --autopitch_threshold 155.0 --autotune True --autotune_tonic "B" --autotune_scale "minor" --autotune_strength 1.0 --upscale True --stereo True --output_format "mp3"

    - name: List output files
      if: ${{ !cancelled() }}
      run: |
        echo "Содержимое output/ (infer.py пишет в $GITHUB_WORKSPACE/output/RVC_output):"
        find output -type f -printf '%10s байт  %p\n' 2>/dev/null || echo "  (ничего не найдено)"

    - name: Upload RVC output artifact
      uses: actions/upload-artifact@v4
      with:
        name: rvc-audio-${{ matrix.python-version }}
        # Путь относительный к $GITHUB_WORKSPACE — не ломается при переименовании репозитория.
        # Раньше здесь был абсолютный /home/runner/work/PolGen/PolGen/output/..., после переезда
        # на MuXVS он не находил ни одного файла и молча публиковал пустой артефакт.
        # if-no-files-found: error — чтобы такой же дрейф пути теперь ронял job, а не прятался.
        path: output/RVC_output/
        if-no-files-found: error
        retention-days: 14

  tts_cli:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip for Python <3.11
      if: ${{ matrix.python-version == '3.10' }}
      run: |
        python -m pip install --upgrade "pip<=24.0"

    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        pip install --no-cache-dir uv
        uv pip install --no-cache-dir torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu -q --system
        uv pip install --no-cache-dir -r requirements.txt -q --system

    - name: Install RVC models
      run: |
        python3 -m rvc.inference.modules.model_manager "https://huggingface.co/Politrees/Victor_Tsoi/resolve/main/Victor_Tsoi.zip?download=true" "Tsoi"

    - name: Run tts script
      run: |
        python3 -m rvc.inference.infer_cli tts --tts_voice "en-US-GuyNeural" --tts_text "e" --tts_rate 0 --tts_volume 0 --tts_pitch 0 --rvc_model "Tsoi" --f0_method "rmvpe+" --f0_min 1 --f0_max 1100 --rvc_pitch -6 --protect 0.5 --index_rate 0 --volume_envelope 1 --autopitch True --autopitch_threshold 155.0 --autotune True --autotune_tonic "B" --autotune_scale "minor" --autotune_strength 1.0 --upscale True --stereo True --output_format "mp3"

    - name: List output files
      if: ${{ !cancelled() }}
      run: |
        echo "Содержимое output/ (ожидаются TTS_Voice.wav и TTS_Voice_(Tsoi).mp3):"
        find output -type f -printf '%10s байт  %p\n' 2>/dev/null || echo "  (ничего не найдено)"

    # Раньше у tts_cli шага выгрузки не было вовсе — результат синтеза просто терялся.
    - name: Upload TTS output artifact
      uses: actions/upload-artifact@v4
      with:
        name: tts-audio-${{ matrix.python-version }}
        path: output/RVC_output/
        if-no-files-found: error
        retention-days: 14
